<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 368 112" fill="none">
  <defs>
    <!-- Primary hero leaf gradient: deep forest -> vibrant emerald -> crimson -->
    <linearGradient id="spentaHeroLeaf" x1="8" y1="16" x2="78" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#134D32" />
      <stop offset="46%" stop-color="#189350" />
      <stop offset="82%" stop-color="#B91C2E" />
      <stop offset="100%" stop-color="#DC2638" />
    </linearGradient>

    <!-- Mini circuit leaf inside the bowl of 'p' -->
    <linearGradient id="spentaMiniLeaf" x1="142" y1="42" x2="170" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#157F47" />
      <stop offset="52%" stop-color="#1CA15A" />
      <stop offset="88%" stop-color="#B91C2E" />
      <stop offset="100%" stop-color="#DC2638" />
    </linearGradient>

    <!-- Wordmark s gradient -->
    <linearGradient id="spentaWordS" x1="88" y1="36" x2="132" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#134C30" />
      <stop offset="100%" stop-color="#196B40" />
    </linearGradient>

    <!-- Stylized leaf 'e' gradient -->
    <linearGradient id="spentaWordE" x1="184" y1="78" x2="226" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C311F" />
      <stop offset="55%" stop-color="#157F47" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Wordmark n gradient -->
    <linearGradient id="spentaWordN" x1="234" y1="40" x2="274" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15844A" />
      <stop offset="65%" stop-color="#0F472B" />
      <stop offset="100%" stop-color="#092919" />
    </linearGradient>

    <!-- Wordmark t gradient -->
    <linearGradient id="spentaWordT" x1="280" y1="22" x2="310" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#177845" />
      <stop offset="60%" stop-color="#10492C" />
      <stop offset="100%" stop-color="#36624B" />
    </linearGradient>

    <!-- Wordmark a ring gradient: emerald -> crimson -->
    <linearGradient id="spentaWordARing" x1="308" y1="42" x2="356" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E6B4D" />
      <stop offset="48%" stop-color="#9A2D41" />
      <stop offset="100%" stop-color="#DC2638" />
    </linearGradient>

    <!-- Wordmark a center dot gradient -->
    <linearGradient id="spentaWordADot" x1="319" y1="50" x2="341" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#187E48" />
      <stop offset="58%" stop-color="#B91C2E" />
      <stop offset="100%" stop-color="#DC2638" />
    </linearGradient>

    <clipPath id="spentaHeroLeafClip">
      <path d="M9 88 C4 51, 22 18, 79 15 C83 62, 54 92, 9 88 Z" />
    </clipPath>
    <clipPath id="spentaMiniLeafClip">
      <path d="M144 68 C143 52, 151 41, 169 40 C170 57, 160 69, 144 68 Z" />
    </clipPath>
  </defs>

  <!-- 1. Left Hero Circuit-Leaf Icon -->
  <path
    d="M9 88 C4 51, 22 18, 79 15 C83 62, 54 92, 9 88 Z"
    fill="url(#spentaHeroLeaf)"
  />
  <g clip-path="url(#spentaHeroLeafClip)" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M13 80 L23 69 L23 56" />
    <circle cx="23" cy="50" r="4.6" />
    <path d="M8 89 L35 63 L48 63 L60 51 L60 37" />
    <circle cx="60" cy="31.5" r="4.6" />
    <circle cx="40.5" cy="49" r="4.6" />
    <path d="M25 87 L39 73 L54 73" />
    <circle cx="59.5" cy="73" r="4.6" />
  </g>

  <!-- 2. Letter 's' + top-right circuit trace & node -->
  <path
    d="M123 42 H100 C94 42 91 45.5 91 50 C91 54.5 94 58 100 58 H117 C123 58 126.5 61.5 126.5 67 C126.5 72.5 123 76 117 76 H91"
    stroke="url(#spentaWordS)"
    stroke-width="6.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path d="M123 40 H130.5" stroke="#134C30" stroke-width="2" stroke-linecap="round" />
  <circle cx="133.5" cy="40" r="2.8" stroke="#134C30" stroke-width="1.8" fill="none" />

  <!-- 3. Letter 'p' with leaf-shaped frame & miniature circuit leaf -->
  <path
    d="M140.5 44 V94"
    stroke="#0E3924"
    stroke-width="7.2"
    stroke-linecap="round"
  />
  <path
    d="M137 44 C150 32.5, 166 32.5, 175.5 34.5 C177.5 58, 165.5 73.5, 140.5 74 Z"
    stroke="#0E3924"
    stroke-width="6.2"
    stroke-linejoin="round"
    fill="none"
  />
  <path
    d="M144 68 C143 52, 151 41, 169 40 C170 57, 160 69, 144 68 Z"
    fill="url(#spentaMiniLeaf)"
  />
  <g clip-path="url(#spentaMiniLeafClip)" stroke="#FFFFFF" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M145 66 L154 57 L160 57 L164 52 L164 47" />
    <circle cx="164" cy="44.8" r="1.9" />
    <path d="M146 61 L150 57 L150 52" />
    <circle cx="150" cy="49.5" r="1.8" />
    <circle cx="156.5" cy="50" r="1.8" />
    <path d="M150 67 L156 61 L162 61" />
    <circle cx="164.2" cy="61" r="1.8" />
  </g>

  <!-- 4. Stylized leaf 'e' -->
  <path
    d="M185 73 C181 55, 195 34, 227 32 C226 47, 217 55, 200 57 L193 58 C196 50, 206 43, 221 41"
    fill="url(#spentaWordE)"
  />
  <path
    d="M185 73 C181 56, 194 35, 227 32 C227 48, 216 58, 198 60 C205 68, 218 70, 227 66 C217 79, 192 81, 185 73 Z"
    fill="url(#spentaWordE)"
  />
  <!-- White sweeping leaf-vein cleft bisecting the lower 'e' -->
  <path
    d="M185.5 72.5 C195 62, 208 55, 226 51 L226.5 55.5 C209 59.5, 196.5 66, 188 76 Z"
    fill="#FAF8F4"
    fill-opacity="0.96"
  />

  <!-- 5. Letter 'n' + lower-left downward circuit pin & node -->
  <path
    d="M236.5 75 V52 C236.5 42.5, 244.5 38, 254.5 38 C264.5 38, 272.5 42.5, 272.5 52 V75"
    stroke="url(#spentaWordN)"
    stroke-width="7.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path d="M236.5 76 V88" stroke="#0F472B" stroke-width="2" stroke-linecap="round" />
  <circle cx="236.5" cy="91.2" r="2.9" stroke="#0F472B" stroke-width="1.8" fill="none" />

  <!-- 6. Letter 't' -->
  <path
    d="M291 22 V75 M278 41 H304"
    stroke="url(#spentaWordT)"
    stroke-width="7.2"
    stroke-linecap="round"
  />

  <!-- 7. Letter 'a' with crimson transition & solid inner circle -->
  <path
    d="M350 42 V75 M350 58.5 C350 68.5, 342 76, 331.5 76 C321 76, 313 68.5, 313 58.5 C313 48.5, 321 41, 331.5 41 C342 41, 350 48.5, 350 58.5 Z"
    stroke="url(#spentaWordARing)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="331.5" cy="58.5" r="9.4" fill="url(#spentaWordADot)" />
</svg>
